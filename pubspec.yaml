
name: food_delivery
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Dependency Injection
  get_it: ^9.3.0

  # State Management
  flutter_bloc: ^9.1.1

  # Firebase
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0

  # Authentication
  local_auth: ^3.0.2
  device_info_plus: ^13.3.0

  # Google Maps
  google_maps_flutter: ^2.18.2

  # Networking
  dio: ^5.11.1
  retrofit: ^4.10.0

  # JSON Serialization
  json_annotation: ^4.9.0
  firebase_core: ^4.15.0
  firebase_storage: ^13.6.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lints
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15
  retrofit_generator: ^10.2.3
  json_serializable: ^6.9.5

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter_18pt-Regular.ttf
          weight: 400

        - asset: assets/fonts/Inter/Inter_18pt-Medium.ttf
          weight: 500

        - asset: assets/fonts/Inter/Inter_18pt-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/Inter/Inter_28pt-Bold.ttf
          weight: 700